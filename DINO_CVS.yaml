program: main.py
method: bayes
metric:
  name: eval/mAP
  goal: maximize

parameters:
  weight_decay:
    distribution: log_uniform_values
    min: 1e-5
    max: 5e-4
  lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 3e-4

command:
  - ${env}
  - CUDA_VISIBLE_DEVICES=2
  - python
  - ${program}
  - ${args}
  - "--wandb"